server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Proxy API traffic from the same origin to avoid browser CORS problems.
    location /items { proxy_pass http://api:8080; proxy_set_header X-Request-Id $http_x_request_id; }
    location /tasks { proxy_pass http://api:8080; proxy_set_header X-Request-Id $http_x_request_id; }
    location /health { proxy_pass http://api:8080; proxy_set_header X-Request-Id $http_x_request_id; }
    location /demo/ { proxy_pass http://api:8080; proxy_set_header X-Request-Id $http_x_request_id; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
